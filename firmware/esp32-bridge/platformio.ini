[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Частота процессора 240 МГц для быстрой обработки TCP/UART моста
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Скорость прошивки и монитора порта
upload_speed = 921600
monitor_speed = 115200
upload_port = COM10
monitor_port = COM10

; Опции сборки
build_flags = 
    -D CORE_DEBUG_LEVEL=0
